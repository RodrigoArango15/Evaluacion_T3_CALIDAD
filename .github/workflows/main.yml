name: CI Sistema Academico Python

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código # Clona tu repositorio en el servidor
      uses: actions/checkout@v3
    
    - name: Configurar Python # Instala Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
        
    - name: Ejecutar pruebas unitarias # Corre el archivo de pruebas
      run: |
        python -m unittest test_app.py